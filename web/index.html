    <link rel="canonical" href="https://chndr-prksh.github.io/facet/" />
    <meta property="og:title" content="Facet: test any website on every screen size" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Facet",
        "alternateName": "Facet responsive design tester",
        "url": "https://chndr-prksh.github.io/facet/",
        "description": "A free, open-source responsive design tester. Shows a web page on many phone, tablet, laptop and desktop screen sizes side by side, with 292 device profiles.",

        "operatingSystem": "Any (web browser)",
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },

        "featureList": [
          "Preview a website on many device sizes at once",
          "292 phone, tablet, laptop and desktop profiles",
          "Works with localhost",
          "Shareable links that reopen the same page on the same devices",
          "A/B compare two URLs on every device",
          "Command-line checker and MCP server for AI agents: npx facet-check"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <h1>Facet: test any website on every screen size</h1>
      <p>Facet is a free, open-source responsive design tester. Paste a link and see the page on phones, tablets, laptops and desktops side by side. It needs JavaScript to run.</p>
      <p>Source code, the desktop app and the facet-check command-line tool: <a href="https://github.com/chndr-prksh/facet">github.com/chndr-prksh/facet</a>.</p>
    </noscript>
    <script type="module" src="./src/main.tsx"></script>
