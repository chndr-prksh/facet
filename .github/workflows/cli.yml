name: facet-check

on:
  push:
    branches: [main]
    paths: ['cli/**', 'src/shared/**', 'src/renderer/src/lib/scripts.ts', 'e2e/cli.mjs', 'e2e/fixture/**', 'package.json', '.github/workflows/cli.yml']
  pull_request:
    paths: ['cli/**', 'src/shared/**', 'src/renderer/src/lib/scripts.ts', 'e2e/cli.mjs', 'e2e/fixture/**', 'package.json', '.github/workflows/cli.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The CLI needs none of Electron's binary.
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npx playwright-core install --with-deps chromium
      - run: npx tsc -p cli/tsconfig.json
      - run: npm run test:cli
